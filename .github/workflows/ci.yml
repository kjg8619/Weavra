name: Weavra CI

on:
  push:
    branches: [main, devlop, 'migration/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weavra-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime-pi:
    name: runtime/pi
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: runtime/pi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - name: Install test prerequisites
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
      - name: Install isolated package root
        run: npm ci --ignore-scripts
      - name: Hydrate reviewed model metadata
        run: npm run hydrate:model-data
      - name: Build Runtime packages
        run: npm run build
      - name: Prove immutable imports
        run: node ../../scripts/verify-imports.mjs
      - name: Run Runtime identity, network, lock and full regression gates
        run: node ../../scripts/validate.mjs pi
      - name: Verify staged lock policy regression
        run: node --test scripts/check-lockfile-commit.test.mjs
      - name: Verify nested source archive and catalog tools
        run: node --test ../../scripts/consolidation-paths.test.mjs && node scripts/diff-model-catalog.mjs --thinking openai
      - name: Require unchanged tracked source
        run: git diff --exit-code HEAD --

  app-t3code:
    name: app/t3code
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app/t3code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.10.0 --ignore-scripts
      - name: Install isolated package root
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Explicit reviewed bootstrap
        run: pnpm exec effect-tsgo patch && pnpm --filter @t3tools/desktop run ensure:electron
      - name: Run all workspaces, focused control regressions and quality gates
        run: node ../../scripts/validate.mjs t3
      - name: Require unchanged tracked source
        run: git diff --exit-code HEAD --

  cross-boundary:
    name: cross-boundary
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.10.0 --ignore-scripts
      - name: Install and build Runtime
        working-directory: runtime/pi
        run: npm ci --ignore-scripts && npm run hydrate:model-data && npm run build
      - name: Install App production transport modules
        working-directory: app/t3code
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install fresh isolated browser tooling
        run: node app/t3code/apps/desktop/node_modules/playwright-core/cli.js install chromium
      - name: Resolve pinned Chromium executable
        run: >-
          node --input-type=module -e
          'import { chromium } from "./app/t3code/apps/desktop/node_modules/playwright-core/index.mjs";
          import { appendFileSync } from "node:fs";
          appendFileSync(process.env.GITHUB_ENV, `WEAVRA_CHROMIUM=${chromium.executablePath()}\n`);'
      - name: Exercise real stdio boundary and fresh browser verifier
        run: node scripts/run-cross-boundary.mjs
      - name: Verify combined Broker authority and activation boundaries
        run: node scripts/run-capability-boundary.mjs
      - name: Verify COMPLEX, parallel and Planner Runtime to App corpora (falseCompletion = 0)
        run: node scripts/run-complex-integration.mjs
      - name: Require unchanged tracked source
        run: git diff --exit-code HEAD --
