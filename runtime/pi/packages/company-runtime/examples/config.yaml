# Copy to <project>/.ai/config.yaml and edit before use.
# Provider/model IDs are placeholders, not verified or bundled models.
schemaVersion: 1
models:
  profiles:
    coding:
      provider: your-provider
      model: your-coding-model
    reasoning:
      provider: your-provider
      model: your-review-model
files:
  allowed_paths: [src, test]
verification:
  # Runs registered checks in the OS sandbox: no network, no $HOME/$TMPDIR reads (macOS verified; Linux NOT
  # VERIFIED). Checks that need toolchain caches (~/.m2, ~/.gradle, ~/.cargo, ~/.npm) or downloads need
  # `mode: disabled`, which runs them with this user's filesystem and network access.
  sandbox:
    mode: required
  checks:
    - id: regression
      kind: test
      executable: node
      args: [scripts/check.mjs]
